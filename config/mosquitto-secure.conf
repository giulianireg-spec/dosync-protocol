# DoSync Protocol — Mosquitto MQTT Broker Configuration
# Secure configuration for production deployments
#
# Install Mosquitto:
#   sudo apt-get install -y mosquitto mosquitto-clients
#
# Create password file (run once per user):
#   sudo mosquitto_passwd -c /etc/mosquitto/passwd dosync-hub
#   sudo mosquitto_passwd    /etc/mosquitto/passwd dosync-device
#
# Deploy this config:
#   sudo cp config/mosquitto-secure.conf /etc/mosquitto/conf.d/dosync.conf
#   sudo systemctl restart mosquitto
#
# Configure the hub to authenticate:
#   Add to /etc/systemd/system/dosync.service.d/mqtt.conf:
#     Environment="DOSYNC_MQTT_USER=dosync-hub"
#     Environment="DOSYNC_MQTT_PASSWORD=<your-password>"
#     Environment="DOSYNC_MQTT_SECRET=<your-registration-secret>"
#
# File permissions — prevent credential exposure:
#   sudo chmod 600 /etc/systemd/system/dosync.service.d/mqtt.conf
#   sudo chmod 700 /etc/systemd/system/dosync.service.d/

# ── Listener ─────────────────────────────────────────────────────────────────

# Bind to all interfaces (localhost only for single-machine deployments)
# Use 127.0.0.1 to restrict to localhost if devices connect via the same host
listener 1883

# ── Authentication ────────────────────────────────────────────────────────────

# Disable anonymous access — all clients must authenticate
allow_anonymous false

# Password file (created with mosquitto_passwd)
password_file /etc/mosquitto/passwd

# ── Persistence ──────────────────────────────────────────────────────────────

# Persist retained messages across broker restarts
persistence true
persistence_location /var/lib/mosquitto/

# ── Logging ──────────────────────────────────────────────────────────────────

# Log connections and disconnections for audit
log_type connect
log_type disconnect
log_type warning
log_type error
log_dest syslog

# ── Optional: TLS (recommended for multi-host deployments) ───────────────────

# Uncomment and configure if devices connect over a network:
#
# listener 8883
# cafile   /etc/mosquitto/certs/ca.crt
# certfile /etc/mosquitto/certs/server.crt
# keyfile  /etc/mosquitto/certs/server.key
# require_certificate false    # true = mutual TLS (recommended)
# tls_version tlsv1.2

# ── Topic ACLs (optional, per-user access control) ───────────────────────────

# Uncomment to restrict each device to its own topic namespace:
# acl_file /etc/mosquitto/acl

# Example acl file contents:
#   user dosync-hub
#   topic readwrite dosync/#
#
#   user dosync-device-living-01
#   topic write   dosync/devices/wiz-living1-01/+
#   topic read    dosync/devices/wiz-living1-01/commands
#   topic read    dosync/hub/status
