<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DoSync Hub</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #0a0e1a;
    --surface:   #111827;
    --surface2:  #1a2236;
    --border:    #1e2d45;
    --navy:      #1B3A5C;
    --blue:      #2563EB;
    --blue-dim:  #1d4ed8;
    --teal:      #0d9488;
    --amber:     #d97706;
    --red:       #dc2626;
    --green:     #16a34a;
    --text:      #e2e8f0;
    --text-dim:  #64748b;
    --text-mute: #334155;
    --mono:      'JetBrains Mono', monospace;
    --sans:      'Space Grotesk', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── Grid background ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(37,99,235,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(37,99,235,.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* ── Header ── */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10,14,26,.9);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: .75rem;
  }

  .logo-mark {
    width: 32px; height: 32px;
    background: var(--blue);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 700;
    color: white;
    letter-spacing: -1px;
  }

  .logo-text {
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: -.02em;
  }

  .logo-sub {
    font-size: .7rem;
    color: var(--text-dim);
    font-family: var(--mono);
    margin-left: .25rem;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .ws-indicator {
    display: flex;
    align-items: center;
    gap: .4rem;
    font-size: .75rem;
    font-family: var(--mono);
    color: var(--text-dim);
  }

  .ws-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--text-mute);
    transition: background .3s;
  }
  .ws-dot.connected { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .ws-dot.error     { background: var(--red); }

  .token-input {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: .3rem .6rem;
    font-family: var(--mono);
    font-size: .72rem;
    color: var(--text);
    width: 220px;
    outline: none;
  }
  .token-input:focus { border-color: var(--blue); }
  .token-input::placeholder { color: var(--text-mute); }

  .btn {
    background: var(--blue);
    color: white;
    border: none;
    border-radius: 6px;
    padding: .35rem .8rem;
    font-size: .78rem;
    font-family: var(--sans);
    font-weight: 500;
    cursor: pointer;
    transition: background .2s;
  }
  .btn:hover { background: var(--blue-dim); }
  .btn.sm { padding: .25rem .55rem; font-size: .72rem; }
  .btn.ghost {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
  }
  .btn.ghost:hover { border-color: var(--blue); color: var(--text); }
  .btn.danger { background: var(--red); }

  /* ── Layout ── */
  .app {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: 280px 1fr 320px;
    grid-template-rows: auto 1fr;
    gap: 0;
    height: calc(100vh - 56px);
  }

  /* ── Stats bar ── */
  .stats-bar {
    grid-column: 1 / -1;
    display: flex;
    gap: 0;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  .stat {
    flex: 1;
    padding: .75rem 1.5rem;
    border-right: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: .75rem;
  }
  .stat:last-child { border-right: none; }

  .stat-icon {
    width: 32px; height: 32px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }

  .stat-body {}
  .stat-value {
    font-size: 1.25rem;
    font-weight: 700;
    font-family: var(--mono);
    line-height: 1;
  }
  .stat-label {
    font-size: .68rem;
    color: var(--text-dim);
    margin-top: 2px;
    text-transform: uppercase;
    letter-spacing: .05em;
  }

  /* ── Panels ── */
  .panel {
    border-right: 1px solid var(--border);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .panel:last-child { border-right: none; }

  .panel-header {
    padding: .75rem 1rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    background: var(--surface);
  }

  .panel-title {
    font-size: .78rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--text-dim);
  }

  .panel-body {
    flex: 1;
    overflow-y: auto;
    padding: .75rem;
  }

  .panel-body::-webkit-scrollbar { width: 4px; }
  .panel-body::-webkit-scrollbar-track { background: transparent; }
  .panel-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* ── Device cards ── */
  .device-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: .75rem;
    margin-bottom: .5rem;
    cursor: pointer;
    transition: border-color .2s, background .2s;
  }
  .device-card:hover { border-color: var(--blue); background: var(--surface2); }
  .device-card.emergency { border-left: 2px solid var(--red); }
  .device-card.active { border-color: var(--teal); }

  .device-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: .35rem;
  }

  .device-name {
    font-size: .82rem;
    font-weight: 600;
  }

  .device-adapter {
    font-size: .65rem;
    font-family: var(--mono);
    color: var(--text-dim);
    background: var(--surface2);
    padding: 1px 5px;
    border-radius: 3px;
  }

  .device-id {
    font-size: .68rem;
    font-family: var(--mono);
    color: var(--text-mute);
    margin-bottom: .35rem;
  }

  .device-tags {
    display: flex;
    flex-wrap: wrap;
    gap: .25rem;
  }

  .tag {
    font-size: .62rem;
    padding: 1px 6px;
    border-radius: 3px;
    background: var(--surface2);
    color: var(--text-dim);
    font-family: var(--mono);
  }
  .tag.emergency { background: rgba(220,38,38,.15); color: var(--red); }

  /* ── Main panel — intent launcher ── */
  .main-panel {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .intent-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: .5rem;
    padding: .75rem;
  }

  .intent-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: .9rem 1rem;
    cursor: pointer;
    text-align: left;
    transition: all .2s;
    color: var(--text);
  }
  .intent-btn:hover { border-color: var(--blue); background: var(--surface2); transform: translateY(-1px); }
  .intent-btn.emergency-btn:hover { border-color: var(--red); }
  .intent-btn.emergency-btn { border-left: 2px solid var(--red); }

  .intent-icon { font-size: 1.4rem; margin-bottom: .4rem; display: block; }
  .intent-name { font-size: .82rem; font-weight: 600; margin-bottom: .2rem; }
  .intent-desc { font-size: .7rem; color: var(--text-dim); line-height: 1.4; }

  /* ── Activity feed ── */
  .feed-entry {
    display: flex;
    gap: .6rem;
    padding: .55rem .5rem;
    border-radius: 6px;
    margin-bottom: .25rem;
    animation: fadeIn .3s ease;
    font-size: .78rem;
  }
  .feed-entry:hover { background: var(--surface2); }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateX(8px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  .feed-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-top: 4px;
    flex-shrink: 0;
  }

  .feed-body {}
  .feed-type {
    font-family: var(--mono);
    font-size: .7rem;
    font-weight: 600;
    margin-bottom: 1px;
  }
  .feed-detail { color: var(--text-dim); font-size: .7rem; font-family: var(--mono); }
  .feed-time { color: var(--text-mute); font-size: .65rem; font-family: var(--mono); }

  /* Severity colors */
  .sev-emergency { color: var(--red); }
  .sev-warning   { color: var(--amber); }
  .sev-info      { color: var(--blue); }
  .sev-success   { color: var(--green); }
  .sev-teal      { color: var(--teal); }

  .dot-emergency { background: var(--red); box-shadow: 0 0 4px var(--red); }
  .dot-warning   { background: var(--amber); }
  .dot-info      { background: var(--blue); }
  .dot-success   { background: var(--green); }
  .dot-teal      { background: var(--teal); }

  /* ── Toast ── */
  .toast-container {
    position: fixed;
    bottom: 1.5rem;
    right: 1.5rem;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    gap: .5rem;
  }

  .toast {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: .75rem 1rem;
    font-size: .8rem;
    max-width: 320px;
    animation: toastIn .3s ease;
    box-shadow: 0 4px 20px rgba(0,0,0,.4);
  }
  .toast.success { border-left: 3px solid var(--green); }
  .toast.error   { border-left: 3px solid var(--red); }
  .toast.info    { border-left: 3px solid var(--blue); }

  @keyframes toastIn {
    from { opacity: 0; transform: translateX(20px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  /* ── Empty state ── */
  .empty {
    text-align: center;
    padding: 2rem 1rem;
    color: var(--text-mute);
  }
  .empty-icon { font-size: 2rem; margin-bottom: .5rem; }
  .empty-text { font-size: .78rem; }

  /* ── Audit log compact ── */
  .audit-entry {
    display: flex;
    align-items: center;
    gap: .5rem;
    padding: .3rem .5rem;
    border-radius: 4px;
    font-family: var(--mono);
    font-size: .68rem;
    color: var(--text-dim);
    margin-bottom: 1px;
  }
  .audit-entry:hover { background: var(--surface2); }
  .audit-hash { color: var(--text-mute); width: 72px; flex-shrink: 0; }
  .audit-type { flex: 1; }
  .audit-type.intent { color: var(--green); }
  .audit-type.event  { color: var(--teal); }
  .audit-type.phase  { color: var(--amber); }

  /* ── Scrollbar for main ── */
  .main-scroll {
    flex: 1;
    overflow-y: auto;
  }
  .main-scroll::-webkit-scrollbar { width: 4px; }
  .main-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .section-title {
    font-size: .72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--text-dim);
    padding: .75rem 1rem .4rem;
  }

  .integrity-badge {
    font-size: .68rem;
    font-family: var(--mono);
    padding: 2px 6px;
    border-radius: 3px;
  }
  .integrity-badge.ok  { background: rgba(22,163,74,.15); color: var(--green); }
  .integrity-badge.bad { background: rgba(220,38,38,.15); color: var(--red); }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-mark">DS</div>
    <span class="logo-text">DoSync<span class="logo-sub" id="hubVersion">Hub</span></span>
  </div>
  <div class="header-right">
    <div class="ws-indicator">
      <div class="ws-dot" id="wsDot"></div>
      <span id="wsStatus">not connected</span>
    </div>
    <input class="token-input" id="tokenInput" type="password"
           placeholder="API token — printed on first start, or press ?"
           title="The hub prints a token the first time it starts. Press ? to choose your own or turn authentication off."
           autocomplete="off">
    <button class="btn sm" onclick="connect()">Connect</button>
    <!-- The field said "API token…" and nothing else, and the project's own
         author could not work out where to get one — so a newcomer certainly
         cannot. Keys are stored hashed and shown once, so the honest answer is
         not "look it up" but "choose or mint one", and the page now says so. -->
    <button class="btn sm" onclick="showTokenHelp()" title="Where do I get a token?">?</button>
    <button class="btn sm" onclick="openAccess()" title="Access settings">⚙</button>
  </div>
</header>

<div class="app">

  <!-- Stats bar -->
  <div class="stats-bar">
    <div class="stat">
      <div class="stat-icon" style="background:rgba(37,99,235,.15)">📡</div>
      <div class="stat-body">
        <div class="stat-value" id="statDevices">—</div>
        <div class="stat-label">Devices</div>
      </div>
    </div>
    <div class="stat">
      <div class="stat-icon" style="background:rgba(13,148,136,.15)">⚡</div>
      <div class="stat-body">
        <div class="stat-value" id="statEvents">0</div>
        <div class="stat-label">Events today</div>
      </div>
    </div>
    <div class="stat">
      <div class="stat-icon" style="background:rgba(22,163,74,.15)">✓</div>
      <div class="stat-body">
        <div class="stat-value" id="statIntents">0</div>
        <div class="stat-label">Intents executed</div>
      </div>
    </div>
    <div class="stat">
      <div class="stat-icon" style="background:rgba(217,119,6,.15)">🏠</div>
      <div class="stat-body">
        <div class="stat-value" id="statOccupied">—</div>
        <div class="stat-label">Occupancy</div>
      </div>
    </div>
    <div class="stat">
      <div class="stat-icon" style="background:rgba(37,99,235,.1)">🔌</div>
      <div class="stat-body">
        <div class="stat-value" id="statWs">0</div>
        <div class="stat-label">WS clients</div>
      </div>
    </div>
  </div>

  <!-- Left: Devices -->
  <div class="panel">
    <div class="panel-header">
      <span class="panel-title">Devices</span>
      <!-- A hub with no devices used to be a dead end: nothing on this page said
           what to do next, and the only way forward was a hand-written JSON
           manifest sent with curl. The scan endpoints existed all along and
           nothing here called them. -->
      <button class="btn ghost sm" onclick="scanDevices()"
              title="Look for devices on this network">Scan</button>
      <button class="btn ghost sm" onclick="loadDevices()">↺</button>
    </div>
    <div class="panel-body" id="deviceList">
      <div class="empty">
        <div class="empty-icon">📡</div>
        <div class="empty-text">Connect to see devices</div>
      </div>
    </div>
  </div>

  <!-- Center: Intent launcher + audit -->
  <div class="panel main-panel" style="border-right:1px solid var(--border)">
    <div class="panel-header">
      <span class="panel-title">Intent Launcher</span>
    </div>
    <div class="main-scroll">
      <!-- Populated from GET /v1/intent-classes, not written here.
           This grid used to hold eight hardcoded home scenarios — Good Morning,
           Bedtime, Blinds up, Coffee on — which made the project's only visual
           artifact contradict its central claim: DoSync is domain-agnostic and
           explicitly not a smart-home product. Anyone evaluating it for a plant
           or a care facility opened this page and saw a house. Now the launcher
           shows whatever intent classes THIS deployment has registered, so a
           factory sees factory intents and a hospital sees clinical ones. -->
      <div class="intent-grid" id="intentGrid">
        <div class="empty"><div class="empty-text">Connect to load intents</div></div>
      </div>

      <div class="section-title">Audit Log <span id="integrityBadge"></span></div>
      <div style="padding:0 .75rem .75rem" id="auditList">
        <div class="empty"><div class="empty-text">No entries yet</div></div>
      </div>
    </div>
  </div>

  <!-- Right: Live feed -->
  <div class="panel">
    <div class="panel-header">
      <span class="panel-title">Live Events</span>
      <button class="btn ghost sm" onclick="clearFeed()">Clear</button>
    </div>
    <div class="panel-body" id="feedList">
      <div class="empty">
        <div class="empty-icon">📡</div>
        <div class="empty-text">Waiting for events…</div>
      </div>
    </div>
  </div>

</div>

<div class="toast-container" id="toastContainer"></div>

<script>
// ── State ─────────────────────────────────────────────────────────────────────
let ws        = null;
let token     = '';
let eventCount  = 0;
let intentCount = 0;
// Derived from how this page was actually loaded, not assumed.
//
// These were hardcoded to http:// and ws:// on port 47200, which meant the
// dashboard could not work on any TLS deployment: a browser refuses to let an
// HTTPS page fetch http:// or open ws:// (mixed content), so the request never
// left the tab and the UI simply stayed "disconnected" with no error. The hub
// warns at every startup that TLS is not configured — and the moment an
// operator complied, its own interface stopped working. It also broke on any
// port other than 47200.
const HUB = `${window.location.protocol}//${window.location.host}`;
const WS  = `${window.location.protocol === 'https:' ? 'wss:' : 'ws:'}//${window.location.host}`;

// ── Init ──────────────────────────────────────────────────────────────────────
window.addEventListener('load', () => {
  const saved = localStorage.getItem('dosync_token');
  if (saved) {
    document.getElementById('tokenInput').value = saved;
    token = saved;
    connect();
  }
});

// ── WebSocket ─────────────────────────────────────────────────────────────────
// Access settings, in the browser. Changing the password or turning the token
// requirement off used to require a shell — which put a wall in front of exactly
// the person least able to climb it: someone running this at home, behind a
// router, for whom a token guards against nobody already inside the house.
async function openAccess() {
  if (!token) { alert("Connect first, then change access settings."); return; }
  let mode;
  try { mode = await api('GET', '/v1/auth/mode'); }
  catch { alert("Could not read the access settings."); return; }

  if (mode.env_override) {
    alert("Access is fixed by this hub's environment\n\n" +
          "DOSYNC_AUTH is set in the service configuration, which takes " +
          "precedence over anything set here — a click in a browser should not " +
          "override what the machine was told to do.\n\n" +
          "Remove it from the unit file to manage access from this page.");
    return;
  }

  const choice = prompt(
    "Access settings\n\n" +
    "Authentication is currently " + (mode.auth_required ? "REQUIRED" : "OFF") + ".\n\n" +
    "Type:\n" +
    "  a new password  → to set it (12 characters minimum)\n" +
    "  off             → to stop requiring a token\n" +
    "  on              → to start requiring one\n");
  if (!choice) return;

  try {
    if (choice.trim().toLowerCase() === 'off') {
      if (!confirm("Turn authentication OFF?\n\nAnyone who can reach this hub on " +
                   "the network will be able to control your devices. Reasonable on " +
                   "a home network behind a router; not for a hub reachable from " +
                   "outside it.\n\nThis is recorded in the audit log.")) return;
      await api('POST', '/v1/auth/mode', { auth_required: false, confirm: true });
      alert("Authentication is off. Recorded in the audit log.");
    } else if (choice.trim().toLowerCase() === 'on') {
      await api('POST', '/v1/auth/mode', { auth_required: true });
      alert("Authentication is required again. Recorded in the audit log.");
    } else {
      const r = await api('POST', '/v1/auth/token',
                          { token: choice.trim(), label: 'dashboard' });
      alert("Password set." + (r.weak ? "\n\nIt is on the short side — a bearer " +
            "token has no lockout, so a passphrase of several words is safer." : "") +
            "\n\nYour previous token still works until you revoke it.");
    }
  } catch (e) {
    alert("Could not apply that: " + (e.message || e));
  }
}

// Which transports were searched, and which were skipped. The scan endpoint
// has always reported both — the page used to discard them, which is how a
// scan that never searched WiZ could tell an operator that nothing answered.
function describeCoverage(res) {
  const searched = res.searched || [];
  const skipped  = res.not_searchable || [];
  let out = "";
  if (searched.length) out += "Searched: " + searched.join(", ") + "\n";
  if (skipped.length)  out += "Not searched: " + skipped.join(", ") + "\n";
  if (!searched.length && !skipped.length)
    out += "The hub did not report which transports it covered.\n";
  return out;
}

function showTokenHelp() {
  alert(
    "DoSync access\n\n" +
    "The hub prints a token the first time it starts and stores only a hash of" +
    " it, so it cannot show you that one again. Three ways forward:\n\n" +
    "1. CHOOSE one, like a password, so you need not store 43 random characters:\n" +
    "   dosync-manage keys create --token \"my-house-2026\" --label dashboard\n\n" +
    "2. Let it generate one, for a program that will store it:\n" +
    "   dosync-manage keys create --label dashboard\n\n" +
    "3. Turn authentication off, if this hub sits on a home network behind a\n" +
    "   router and nothing outside can reach it:\n" +
    "   DOSYNC_AUTH=false\n\n" +
    "(from a clone, replace dosync-manage with: python3 manage.py)\n\n" +
    "`keys list` shows which keys exist, but only a preview of each — they are" +
    " hashed, by design.");
}

// Bumped on every call to connect(). A closing socket's callbacks check this
// before touching global state, so a stale connection — from the auto-connect
// on page load racing a manual Connect click, or an old retry timer firing
// after a fresh connection succeeded — cannot flip the indicator or schedule
// its own reconnect once superseded. Two sockets both wanting to be "the"
// connection is what produced a status that flickered between live and
// unavailable: not a real disconnection, two generations of connect() briefly
// disagreeing about which of them was current.
let wsGeneration = 0;

function connect() {
  token = document.getElementById('tokenInput').value.trim();
  if (token) localStorage.setItem('dosync_token', token);

  const myGeneration = ++wsGeneration;
  if (ws) ws.close();

  const url = token ? `${WS}/ws?token=${token}` : `${WS}/ws`;
  const socket = new WebSocket(url);
  ws = socket;

  socket.onopen = () => {
    if (myGeneration !== wsGeneration) { socket.close(); return; }
    setWsStatus('live');
    loadStatus();
    loadDevices();
    loadIntents();
    loadAudit();
  };

  socket.onmessage = (e) => {
    if (myGeneration !== wsGeneration) return;
    const msg = JSON.parse(e.data);
    handleWsEvent(msg);
  };

  socket.onclose = (e) => {
    if (myGeneration !== wsGeneration) return;   // superseded — not a real drop
    if (e.code === 4001) {
      setWsStatus('error');
      toast('Invalid token — check your API key', 'error');
    } else {
      // "disconnected" described the WEBSOCKET and was read as "the hub is
      // unreachable" — on a clean Windows install the header said it while
      // devices loaded, scans ran and every call returned 200, because uvicorn
      // had no library to speak WebSocket. The word has to say which of the two
      // things is missing.
      setWsStatus(token ? 'live events unavailable' : 'not connected');
      setTimeout(() => { if (myGeneration === wsGeneration) connect(); }, 3000);
    }
  };

  socket.onerror = () => { if (myGeneration === wsGeneration) setWsStatus('error'); };
}

function setWsStatus(status) {
  const dot  = document.getElementById('wsDot');
  const text = document.getElementById('wsStatus');
  dot.className  = 'ws-dot ' + status;
  text.textContent = status;
}

// ── WS event handler ──────────────────────────────────────────────────────────
function handleWsEvent(msg) {
  const { type, data } = msg;

  if (type === 'connected') {
    document.getElementById('statDevices').textContent = data.devices;
    return;
  }
  if (type === 'ping') return;

  if (type === 'device_event') {
    eventCount++;
    document.getElementById('statEvents').textContent = eventCount;
    addFeedEntry({
      dot:    'dot-' + (data.severity === 'emergency' ? 'emergency' : data.severity === 'warning' ? 'warning' : 'teal'),
      type:   'device_event',
      typeClass: 'sev-teal',
      detail: `${data.device_id} → ${data.event_id} [${data.severity}]`,
    });
    if (data.severity === 'emergency') {
      toast(`🚨 Emergency: ${data.event_id} from ${data.device_id}`, 'error');
    }
    loadAudit();
  }

  if (type === 'intent_executed') {
    intentCount++;
    document.getElementById('statIntents').textContent = intentCount;
    addFeedEntry({
      dot:    data.success ? 'dot-success' : 'dot-emergency',
      type:   'intent_executed',
      typeClass: 'sev-success',
      detail: `${data.intent} [${data.urgency}] — ${data.actions} action(s)` +
              (data.failed?.length ? ` ⚠ ${data.failed.length} failed` : ''),
    });
    loadAudit();
  }

  if (type === 'phase_executed') {
    addFeedEntry({
      dot:    'dot-warning',
      type:   'phase_executed',
      typeClass: 'sev-teal',
      detail: `Phase: ${data.phase} [${data.phase_num}]`,
    });
  }

  if (type === 'presence_updated') {
    const conf = Math.round((data.occ_confidence || 0) * 100);
    document.getElementById('statOccupied').textContent =
      data.occupied ? `Yes ${conf}%` : `No ${conf}%`;
    addFeedEntry({
      dot:    'dot-info',
      type:   'presence_updated',
      typeClass: 'sev-info',
      detail: `occupied=${data.occupied} conf=${conf}%`,
    });
  }

  if (type === 'device_action') {
    eventCount++;
    document.getElementById('statEvents').textContent = eventCount;
    const icon = data.action === 'turn_off' ? '🌑' :
                 data.action === 'set_color' ? '🎨' :
                 data.action === 'turn_on'   ? '💡' : '⚡';
    addFeedEntry({
      dot:    data.success ? 'dot-success' : 'dot-emergency',
      type:   'device_action',
      typeClass: 'sev-teal',
      detail: `${icon} ${data.device_id} → ${data.action}`,
    });
  }
}

// ── Feed ──────────────────────────────────────────────────────────────────────
function addFeedEntry({ dot, type, typeClass, detail }) {
  const list = document.getElementById('feedList');
  const empty = list.querySelector('.empty');
  if (empty) empty.remove();

  const now  = new Date().toLocaleTimeString();
  const el   = document.createElement('div');
  el.className = 'feed-entry';
  el.innerHTML = `
    <div class="feed-dot ${dot}"></div>
    <div class="feed-body">
      <div class="feed-type ${typeClass}">${type}</div>
      <div class="feed-detail">${detail}</div>
      <div class="feed-time">${now}</div>
    </div>`;
  list.insertBefore(el, list.firstChild);

  // Keep max 100 entries
  while (list.children.length > 100) list.lastChild.remove();
}

function clearFeed() {
  document.getElementById('feedList').innerHTML =
    '<div class="empty"><div class="empty-icon">📡</div><div class="empty-text">Waiting for events…</div></div>';
  eventCount  = 0;
  intentCount = 0;
  document.getElementById('statEvents').textContent  = '0';
  document.getElementById('statIntents').textContent = '0';
}

// ── API calls ─────────────────────────────────────────────────────────────────
const headers = () => ({
  'Content-Type': 'application/json',
  ...(token ? { 'Authorization': `Bearer ${token}` } : {}),
});

async function api(method, path, body) {
  try {
    const r = await fetch(HUB + path, {
      method,
      headers: headers(),
      body: body ? JSON.stringify(body) : undefined,
    });
    if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
    return r.json();
  } catch (e) {
    toast(e.message, 'error');
    throw e;
  }
}

async function loadStatus() {
  try {
    const s = await api('GET', '/v1/status');
    document.getElementById('statDevices').textContent = s.devices;
    document.getElementById('statOccupied').textContent =
      s.occupied ? 'Yes' : 'No';
    document.getElementById('statWs').textContent = s.ws_connections ?? 1;
    // The version was written into the markup as "v0.1" and stayed there for
    // three releases — a fourth hardcoded source, and the only one a visitor
    // ever sees. Reported by the hub now, like every other number here.
    document.getElementById('hubVersion').textContent =
      'Hub v' + s.version + ' · ' + s.protocol;
  } catch {}
}

// Build the launcher from what THIS deployment registered. A home shows home
// intents, a plant shows industrial ones, and neither is written into this file.
async function loadIntents() {
  const grid = document.getElementById('intentGrid');
  try {
    const data = await api('GET', '/v1/intent-classes');
    const classes = data.intent_classes || [];
    if (!classes.length) {
      grid.innerHTML = '<div class="empty"><div class="empty-text">' +
        'No intent classes registered</div></div>';
      return;
    }
    // Emergency first: in a real incident the button you need must not be the
    // one you scroll to.
    const rank = { emergency: 0, alert: 1, warning: 2, info: 3 };
    classes.sort((a, b) => (rank[a.urgency] ?? 9) - (rank[b.urgency] ?? 9) ||
                            a.name.localeCompare(b.name));
    const icon = u => u === 'emergency' ? '🚨' : u === 'alert' ? '⚠️'
                    : u === 'warning' ? '🔔' : '•';
    grid.innerHTML = classes.map(c => {
      const label = c.name.replace(/_/g, ' ')
        .replace(/\b\w/g, m => m.toUpperCase());
      const desc = (c.description || '')
        .replace(/[<>&]/g, ch => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[ch]));
      return '<button class="intent-btn' +
        (c.urgency === 'emergency' ? ' intent-emergency' : '') +
        '" onclick="fireIntent(\'' + c.name + '\',\'' + c.urgency + '\')">' +
        '<span class="intent-icon">' + icon(c.urgency) + '</span>' +
        '<div class="intent-name">' + label + '</div>' +
        '<div class="intent-desc">' + desc + '</div></button>';
    }).join('');
  } catch {
    grid.innerHTML = '<div class="empty"><div class="empty-text">' +
      'Could not load intents</div></div>';
  }
}

// Scanning shows CANDIDATES and changes nothing. The operator picks which ones
// become devices and what they are called — approval and naming in one step.
// Registering whatever answered a broadcast would contradict the premise of a
// protocol built around being able to account for what is in it, and
// `wiz-a4c138` is what the bulb calls itself, not what its owner calls it.
// Nothing has declared what this device can do, so the hub cannot act on it.
// This hands over the text needed to fix that — assembled by the hub from what
// the device announced, the tag vocabulary and the adapter format.
//
// Copyable rather than sent anywhere: in a plant, a hospital or a managed
// building, sending the topology of a network to an outside model is often
// prohibited and many such networks have no route out at all. The person takes
// this to whatever model their organisation allows, or to an engineer.
async function describeDevice(id) {
  let text;
  try {
    // Plain text, not JSON: api() always parses, and passing it a fourth
    // argument it does not take produced "Unexpected token 'Y'" — the first
    // word of the description. Tested with curl and not with the button.
    const r = await fetch(HUB + `/v1/devices/${encodeURIComponent(id)}/describe`,
                          { headers: headers() });
    if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
    text = await r.text();
  } catch (e) {
    alert("Could not assemble the description: " + (e.message || e));
    return;
  }
  // The clipboard API needs a secure context — HTTPS or localhost — and a hub
  // reached at http://<lan-address> is neither. It happened to work here; where
  // it does not, an empty catch followed by "Copied to your clipboard" would be
  // the system asserting something that did not happen.
  let copied = false;
  try {
    await navigator.clipboard.writeText(text);
    copied = true;
  } catch (e) {
    console.warn("clipboard unavailable:", e);
  }
  alert((copied
          ? "Copied to your clipboard.\n\n"
          : "Could not reach your clipboard — that needs HTTPS or localhost.\n" +
            "The text is in the panel behind this message; select it there.\n\n") +
        "Give it to any assistant you use, or to an engineer. Save what comes " +
        "back in your declarative directory and reload the hub.\n\n" +
        "Read it before the hub uses it: whoever writes it works from what the " +
        "device announced, not from its documentation. The file goes through " +
        "your change review like any other change.");
}

async function scanDevices() {
  if (!token) { alert("Connect first."); return; }
  const list = document.getElementById('deviceList');
  const previous = list.innerHTML;
  list.innerHTML = '<div class="empty"><div class="empty-text">Scanning…</div></div>';

  let found, res;
  try {
    // Keep the whole response: it carries which transports were searched and
    // which were skipped, and discarding that is how "nothing answered" got
    // told about bulbs that were powered on.
    res = await api('GET', '/v1/discovery/scan');
    found = res.found || [];
  } catch (e) {
    list.innerHTML = previous;
    alert("Scan failed: " + (e.message || e));
    return;
  }

  const fresh = found.filter(d => !d.registered);
  if (!found.length) {
    list.innerHTML = previous;
    // Saying "none" is itself information: the hub is alive and reachable, so
    // the problem is elsewhere. Silence would leave the user unable to tell
    // this apart from a broken page.
    // The endpoint has always reported which transports it covered and which
    // it could not, and the page threw that away — so a scan that never
    // searched WiZ, because pywizlight was missing, told the operator that no
    // device had answered. The bulbs were on. Nothing answered because nobody
    // asked.
    alert("No devices answered on this network.\n\n" +
          describeCoverage(res) +
          "\nAnything a transport cannot reach is registered directly with " +
          "POST /v1/devices/register, which is a normal path, not a failure.");
    return;
  }
  if (!fresh.length) {
    list.innerHTML = previous;
    alert("Found " + found.length + " device(s), all already registered.");
    return;
  }

  let adopted = 0;
  for (const d of fresh) {
    // What it announced itself as is the useful part: "3dprinter" tells a
    // person what they are looking at; an address does not. Findings from a
    // transport discoverer carry no adapter, so say that plainly rather than
    // printing an empty pair of brackets.
    const how = d.adapter ? d.adapter : (d.service_type || "unidentified");
    // The hub knew this address already and the person was never told: they
    // recognise the name they chose, and a name is what settles it. Shown, not
    // acted on — addresses move, and concluding identity from one would fuse
    // two devices some day, which is worse than the duplicate it would prevent.
    const known = d.possibly_known ? (
      "\n\nYou may already have this one: a device you named " +
      `"${d.possibly_known.device_name}" is registered at this same address.` +
      "\nAdding it again would give you two entries for one device.") : "";
    // Announcing itself as commissionable means nobody has paired it. On a
    // shared network it may not be yours.
    const pairing = d.commissionable ?
      "\n\nThis device is announcing that it has not been paired with anything " +
      "yet. On a shared network, it may belong to someone else." : "";
    const note = d.adapter ? "" :
      "\n\nNothing has declared what this device can do yet, so adding it " +
      "records it in your inventory — the hub will say so rather than act on it." +
      "\n\nTo make it act, something has to describe what it can do. After " +
      "adding it, the device card offers the text you need for that.";
    const name = prompt(
      "Found: " + (d.device_name || d.device_id) + "  (" + how + " @ " + d.ip + ")" +
      known + pairing + note + "\n\n" +
      "Name it to add it — this is the name you will see everywhere else.\n" +
      "Leave empty to skip this one.", d.device_name || '');
    if (!name || !name.trim()) continue;
    try {
      await api('POST', '/v1/discovery/adopt', {
        adapter: d.adapter, device_id: d.device_id, ip: d.ip,
        service_type: d.service_type, device_name: name.trim() });
      adopted++;
    } catch (e) {
      alert("Could not add " + d.device_id + ": " + (e.message || e));
    }
  }
  await loadDevices();
  await loadStatus();
  if (adopted) alert("Added " + adopted + " device(s). Recorded in the audit log.");
}

async function renameDevice(id, current) {
  const name = prompt("Rename this device.\n\nThis changes only what it is " +
                      "called — what it can do comes from the device itself.",
                      current || id);
  if (!name || !name.trim() || name.trim() === current) return;
  try {
    await api('PATCH', '/v1/devices/' + encodeURIComponent(id),
              { device_name: name.trim() });
    await loadDevices();
  } catch (e) { alert("Could not rename: " + (e.message || e)); }
}

async function removeDevice(id, name) {
  // Deliberately says what it does and does not do: unregistering is not the
  // same as the device disappearing, and someone who expects the light to stop
  // working will be confused when it does not.
  if (!confirm("Remove \"" + (name || id) + "\" from this hub?\n\n" +
               "The device keeps working on its own; DoSync simply stops " +
               "knowing about it, and intents will no longer include it.\n\n" +
               "Recorded in the audit log. You can add it again with Scan.")) return;
  try {
    await api('DELETE', '/v1/devices/' + encodeURIComponent(id));
    await loadDevices();
    await loadStatus();
  } catch (e) { alert("Could not remove: " + (e.message || e)); }
}

async function loadDevices() {
  try {
    const data = await api('GET', '/v1/devices');
    const list = document.getElementById('deviceList');
    list.innerHTML = '';

    if (!data.devices?.length) {
      // An empty hub used to be a dead end — nothing said what to do next, and
      // the only exit was a hand-written JSON manifest. Now it names the button.
      list.innerHTML = '<div class="empty"><div class="empty-icon">📡</div>' +
        '<div class="empty-text">No devices yet.<br><br>' +
        'Press <b>Scan</b> above to look for devices on this network, or ' +
        'register one directly with POST /v1/devices/register.</div></div>';
      return;
    }

    data.devices.forEach(d => {
      const isEmerg = d.emergency_capable;
      const adapter = d.adapter || 'simulated';
      const tags    = (d.tags || []);
      const card    = document.createElement('div');
      card.className = `device-card ${isEmerg ? 'emergency' : ''}`;
      card.innerHTML = `
        <div class="device-top">
          <span class="device-name">${d.device_name}</span>
          ${d.quarantined ? '<span class="device-adapter" style="color:#f59e0b" ' +
            'title="' + (d.quarantine_reason || '') + ' — excluded from intents until you ' +
            'remove it or restore its file">quarantined</span>' : ''}
          <span class="device-adapter">${adapter}</span>
          <!-- Renaming meant re-registering the whole manifest and removing meant
               curl. Telling a non-developer the bar is lower while leaving them
               a terminal for their first mistake would not have been true. -->
          <span class="device-actions">
            <button class="btn ghost sm" title="Rename"
                    onclick="renameDevice('${d.device_id}','${(d.device_name||'').replace(/'/g,"\\'")}')">✎</button>
            <button class="btn ghost sm" title="Remove from this hub"
                    onclick="removeDevice('${d.device_id}','${(d.device_name||'').replace(/'/g,"\\'")}')">✕</button>
            <!-- The hub already knows this device cannot act — it says so on
                 every start and marks the card. Knowing the problem and not
                 offering the step that fixes it wastes the one thing it knows. -->
            ${(!d.adapter || d.adapter === 'simulated') ? `
            <button class="btn ghost sm" title="Get the text that describes what this device can do"
                    onclick="describeDevice('${d.device_id}')">◇</button>` : ''}
          </span>
        </div>
        <div class="device-id">${d.device_id}</div>
        <div class="device-tags">
          ${tags.map(t => `<span class="tag ${t === 'emergency' ? 'emergency' : ''}">${t}</span>`).join('')}
        </div>`;
      list.appendChild(card);
    });
  } catch {}
}

async function loadAudit() {
  try {
    const data = await api('GET', '/v1/audit');
    const list = document.getElementById('auditList');
    list.innerHTML = '';

    // Integrity badge
    const badge = document.getElementById('integrityBadge');
    badge.className = `integrity-badge ${data.integrity ? 'ok' : 'bad'}`;
    badge.textContent = data.integrity ? '✓ intact' : '✗ tampered';

    if (!data.entries?.length) {
      list.innerHTML = '<div class="empty"><div class="empty-text">No entries</div></div>';
      return;
    }

    // Show last 30 entries, newest first
    [...data.entries].reverse().slice(0, 30).forEach(e => {
      const type = e.type || '?';
      const hash = (e.hash || '').substring(0, 8);
      let typeClass = '';
      if (type === 'intent_executed') typeClass = 'intent';
      else if (type === 'device_event') typeClass = 'event';
      else if (type === 'phase_executed') typeClass = 'phase';

      const el = document.createElement('div');
      el.className = 'audit-entry';
      el.innerHTML = `
        <span class="audit-hash">${hash}</span>
        <span class="audit-type ${typeClass}">${type}</span>`;
      list.appendChild(el);
    });
  } catch {}
}

// ── Intent firing ─────────────────────────────────────────────────────────────
async function fireIntent(intent, urgency, context = {}) {
  try {
    const result = await api('POST', '/v1/intent', {
      intent, urgency,
      context: {
        trigger: 'dashboard',
        message: `Dashboard triggered: ${intent}`,
        emergency_number: '911',
        ...context,
      },
    });
    const ok = result.success;
    toast(
      `${ok ? '✓' : '⚠'} ${intent} — ${result.actions_taken} action(s)` +
      (result.failed_devices?.length ? ` (${result.failed_devices.length} failed)` : ''),
      ok ? 'success' : 'error'
    );
    loadAudit();
  } catch {}
}

async function fireSmoke() {
  // Smoke uses /v1/event to trigger the full phased response
  try {
    await api('POST', '/v1/event', {
      device_id: 'smoke-living-01',
      event_id:  'smoke_detected',
      severity:  'emergency',
      data: { smoke_ppm: 450, location: 'living room', source: 'dashboard' },
    });
    // Then fire the intent
    await fireIntent('ensure_safety', 'emergency', {
      trigger: 'smoke_detected',
      message: 'Smoke detected — dashboard test',
    });
  } catch {}
}

// ── Toast ─────────────────────────────────────────────────────────────────────
function toast(msg, type = 'info') {
  const c  = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  c.appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

// ── Periodic refresh ──────────────────────────────────────────────────────────
setInterval(loadStatus, 10000);
setInterval(loadDevices, 30000);
</script>
</body>
</html>
