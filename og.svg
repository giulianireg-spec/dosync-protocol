<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#0D0D0C"/>
  
  <!-- Grid lines subtle -->
  <line x1="0" y1="210" x2="1200" y2="210" stroke="#1A1A18" stroke-width="1"/>
  <line x1="0" y1="420" x2="1200" y2="420" stroke="#1A1A18" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="630" stroke="#1A1A18" stroke-width="1"/>
  <line x1="800" y1="0" x2="800" y2="630" stroke="#1A1A18" stroke-width="1"/>

  <!-- Logo mark -->
  <circle cx="96" cy="96" r="10" fill="#534AB7"/>
  <circle cx="60" cy="60" r="7" fill="none" stroke="#534AB7" stroke-width="2"/>
  <circle cx="132" cy="60" r="7" fill="none" stroke="#534AB7" stroke-width="2"/>
  <circle cx="60" cy="132" r="7" fill="none" stroke="#534AB7" stroke-width="2"/>
  <circle cx="132" cy="132" r="7" fill="none" stroke="#534AB7" stroke-width="2"/>
  <line x1="67" y1="67" x2="88" y2="88" stroke="#AFA9EC" stroke-width="1.5"/>
  <line x1="125" y1="67" x2="104" y2="88" stroke="#AFA9EC" stroke-width="1.5"/>
  <line x1="67" y1="125" x2="88" y2="104" stroke="#AFA9EC" stroke-width="1.5"/>
  <line x1="125" y1="125" x2="104" y2="104" stroke="#AFA9EC" stroke-width="1.5"/>

  <!-- DoSync wordmark -->
  <text x="172" y="82" font-family="Georgia, serif" font-size="48" font-weight="400" fill="#F0EEE8">DoSync</text>
  
  <!-- v0.3 pill -->
  <rect x="172" y="100" width="52" height="22" rx="11" fill="#1A1830"/>
  <text x="198" y="115" font-family="Arial, sans-serif" font-size="12" fill="#AFA9EC" text-anchor="middle">v0.3</text>

  <!-- Main headline -->
  <text x="96" y="260" font-family="Georgia, serif" font-size="64" font-weight="400" fill="#F0EEE8">AI speaks in goals.</text>
  <text x="96" y="340" font-family="Georgia, serif" font-size="64" font-weight="400" fill="#F0EEE8">Devices speak in</text>
  <text x="96" y="420" font-family="Georgia, serif" font-size="64" font-style="italic" fill="#7F77DD">commands.</text>

  <!-- Tagline -->
  <text x="96" y="490" font-family="Arial, sans-serif" font-size="24" fill="#888780">Open protocol · Apache 2.0 · dosync.dev</text>

  <!-- Right side — before/after -->
  <rect x="820" y="180" width="320" height="120" rx="8" fill="#1A1A18" stroke="#2C2C2A" stroke-width="1"/>
  <text x="840" y="210" font-family="Arial, sans-serif" font-size="13" fill="#5F5E5A">Existing protocols</text>
  <text x="840" y="238" font-family="Courier New, monospace" font-size="14" fill="#888780">lock.unlock()</text>
  <text x="840" y="260" font-family="Courier New, monospace" font-size="14" fill="#888780">light.set_brightness(100)</text>
  <text x="840" y="282" font-family="Courier New, monospace" font-size="14" fill="#888780">thermostat.set_temp(21)</text>

  <rect x="820" y="320" width="320" height="120" rx="8" fill="#1A1830" stroke="#534AB7" stroke-width="1"/>
  <circle cx="840" cy="342" r="5" fill="#7F77DD"/>
  <text x="854" y="347" font-family="Arial, sans-serif" font-size="13" fill="#7F77DD">DoSync</text>
  <text x="840" y="378" font-family="Courier New, monospace" font-size="14" fill="#AFA9EC">"there is an emergency"</text>
  <text x="840" y="400" font-family="Courier New, monospace" font-size="14" fill="#AFA9EC">"nobody is home"</text>
  <text x="840" y="422" font-family="Courier New, monospace" font-size="14" fill="#AFA9EC">"good morning"</text>

  <!-- Stats row -->
  <rect x="820" y="460" width="72" height="48" rx="6" fill="#111110" stroke="#2C2C2A" stroke-width="1"/>
  <text x="856" y="482" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#F0EEE8" text-anchor="middle">32/32</text>
  <text x="856" y="498" font-family="Arial, sans-serif" font-size="11" fill="#5F5E5A" text-anchor="middle">tests</text>

  <rect x="904" y="460" width="72" height="48" rx="6" fill="#111110" stroke="#2C2C2A" stroke-width="1"/>
  <text x="940" y="482" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#F0EEE8" text-anchor="middle">&lt;100ms</text>
  <text x="940" y="498" font-family="Arial, sans-serif" font-size="11" fill="#5F5E5A" text-anchor="middle">intent→action</text>

  <rect x="988" y="460" width="72" height="48" rx="6" fill="#111110" stroke="#2C2C2A" stroke-width="1"/>
  <text x="1024" y="482" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#F0EEE8" text-anchor="middle">5</text>
  <text x="1024" y="498" font-family="Arial, sans-serif" font-size="11" fill="#5F5E5A" text-anchor="middle">adapters</text>

  <!-- Bottom border accent -->
  <rect x="0" y="620" width="1200" height="10" fill="#534AB7"/>
</svg>
