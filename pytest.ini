[pytest]
# Test taxonomy (parada técnica 2026-07-21, Morales): as the suite grows past
# 600 tests, CI needs to run subsets. Markers are applied AUTOMATICALLY in
# tests/conftest.py by inspecting each test's source — no per-file edits, no
# drift. Run subsets with:  pytest -m unit   /   pytest -m "not e2e"
markers =
    unit: pure logic, no HTTP layer (fast; the default for most tests)
    e2e: exercises the FastAPI app via TestClient (slower, spins up the app)
    asyncio: coroutine test driven through an event loop
