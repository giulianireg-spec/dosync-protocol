<svg width="680" height="520" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" role="img">
<title>DoSync Protocol — 5-layer architecture</title>
<desc>The 5 layers of the DoSync protocol: Intent, Semantic Resolver, Registry, Secure Channel, and Transport HAL</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .th  { font-size: 14px; font-weight: 700; }
  .ts  { font-size: 12px; font-weight: 500; }
</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<rect x="40" y="30" width="600" height="64" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
<text class="th" x="120" y="57" dominant-baseline="central" fill="#26215C">Layer 5 — Intent</text>
<text class="ts" x="120" y="77" dominant-baseline="central" fill="#3C3489">AI expresses semantic goals</text>
<text class="ts" x="520" y="62" dominant-baseline="central" text-anchor="middle" fill="#3C3489">"there is an emergency"</text>
<line x1="340" y1="94" x2="340" y2="114" stroke="#555" stroke-width="1" marker-end="url(#arr)"/>
<rect x="40" y="114" width="600" height="64" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
<text class="th" x="120" y="141" dominant-baseline="central" fill="#04342C">Layer 4 — Semantic resolver</text>
<text class="ts" x="120" y="161" dominant-baseline="central" fill="#085041">Maps intent to device actions</text>
<text class="ts" x="520" y="146" dominant-baseline="central" text-anchor="middle" fill="#085041">ensure_safety / emergency</text>
<line x1="340" y1="178" x2="340" y2="198" stroke="#555" stroke-width="1" marker-end="url(#arr)"/>
<rect x="40" y="198" width="600" height="64" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1"/>
<text class="th" x="120" y="225" dominant-baseline="central" fill="#042C53">Layer 3 — Registry</text>
<text class="ts" x="120" y="245" dominant-baseline="central" fill="#0C447C">Devices declare capabilities on join</text>
<text class="ts" x="520" y="230" dominant-baseline="central" text-anchor="middle" fill="#0C447C">CapabilityManifest · emergency_capable</text>
<line x1="340" y1="262" x2="340" y2="282" stroke="#555" stroke-width="1" marker-end="url(#arr)"/>
<rect x="40" y="282" width="600" height="64" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
<text class="th" x="120" y="309" dominant-baseline="central" fill="#412402">Layer 2 — Secure channel</text>
<text class="ts" x="120" y="329" dominant-baseline="central" fill="#633806">mTLS · local PKI · no internet required</text>
<text class="ts" x="520" y="314" dominant-baseline="central" text-anchor="middle" fill="#633806">SHA-256 audit log · API keys</text>
<line x1="340" y1="346" x2="340" y2="366" stroke="#555" stroke-width="1" marker-end="url(#arr)"/>
<rect x="40" y="366" width="600" height="64" rx="8" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="1"/>
<text class="th" x="120" y="393" dominant-baseline="central" fill="#2C2C2A">Layer 1 — Transport (HAL)</text>
<text class="ts" x="120" y="413" dominant-baseline="central" fill="#2C2C2A">Any physical medium</text>
<text class="ts" x="520" y="398" dominant-baseline="central" text-anchor="middle" fill="#2C2C2A">WiFi · BLE · Zigbee · Z-Wave · Thread</text>
<line x1="340" y1="430" x2="340" y2="455" stroke="#555" stroke-width="1" marker-end="url(#arr)"/>
<text x="340" y="453" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#444">Physical devices</text>
<rect x="50"  y="462" width="90"  height="34" rx="6" fill="#D3D1C7" stroke="#888780"/>
<text x="95"  y="479" text-anchor="middle" dominant-baseline="central" font-family="-apple-system,sans-serif" font-size="12" font-weight="600" fill="#2C2C2A">Lights</text>
<rect x="158" y="462" width="90"  height="34" rx="6" fill="#D3D1C7" stroke="#888780"/>
<text x="203" y="479" text-anchor="middle" dominant-baseline="central" font-family="-apple-system,sans-serif" font-size="12" font-weight="600" fill="#2C2C2A">Locks</text>
<rect x="266" y="462" width="90"  height="34" rx="6" fill="#D3D1C7" stroke="#888780"/>
<text x="311" y="479" text-anchor="middle" dominant-baseline="central" font-family="-apple-system,sans-serif" font-size="12" font-weight="600" fill="#2C2C2A">Sensors</text>
<rect x="374" y="462" width="90"  height="34" rx="6" fill="#D3D1C7" stroke="#888780"/>
<text x="419" y="479" text-anchor="middle" dominant-baseline="central" font-family="-apple-system,sans-serif" font-size="12" font-weight="600" fill="#2C2C2A">Alarms</text>
<rect x="482" y="462" width="148" height="34" rx="6" fill="#D3D1C7" stroke="#888780"/>
<text x="556" y="479" text-anchor="middle" dominant-baseline="central" font-family="-apple-system,sans-serif" font-size="12" font-weight="600" fill="#2C2C2A">Notifications</text>
</svg>
