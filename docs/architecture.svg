<svg width="680" height="520" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" role="img">
<title>DoSync Protocol — 5-layer architecture</title>
<desc>The 5 layers of the DoSync protocol: Intent, Semantic Resolver, Registry, Secure Channel, and Transport HAL</desc>

<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1a1a1a; }
  .th  { font-size: 14px; font-weight: 600; }
  .ts  { font-size: 12px; font-weight: 400; fill: #555; }
  .layer { stroke-width: 1; }
  @media (prefers-color-scheme: dark) {
    text { fill: #e5e5e5; }
    .ts  { fill: #aaa; }
  }
</style>

<!-- Layer 5 — Intent -->
<rect class="layer" x="40" y="30" width="600" height="64" rx="8" fill="#EEEDFE" stroke="#7F77DD"/>
<text class="th" x="120" y="57" dominant-baseline="central" fill="#3C3489">Layer 5 — Intent</text>
<text class="ts" x="120" y="77" dominant-baseline="central" fill="#534AB7">AI expresses semantic goals</text>
<text class="ts" x="520" y="62" dominant-baseline="central" text-anchor="middle" fill="#534AB7">"there is an emergency"</text>

<!-- Arrow -->
<line x1="340" y1="94" x2="340" y2="114" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>

<!-- Layer 4 — Semantic -->
<rect class="layer" x="40" y="114" width="600" height="64" rx="8" fill="#E1F5EE" stroke="#1D9E75"/>
<text class="th" x="120" y="141" dominant-baseline="central" fill="#085041">Layer 4 — Semantic resolver</text>
<text class="ts" x="120" y="161" dominant-baseline="central" fill="#0F6E56">Maps intent → device actions</text>
<text class="ts" x="520" y="146" dominant-baseline="central" text-anchor="middle" fill="#0F6E56">ensure_safety / emergency</text>

<!-- Arrow -->
<line x1="340" y1="178" x2="340" y2="198" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>

<!-- Layer 3 — Registry -->
<rect class="layer" x="40" y="198" width="600" height="64" rx="8" fill="#E6F1FB" stroke="#378ADD"/>
<text class="th" x="120" y="225" dominant-baseline="central" fill="#0C447C">Layer 3 — Registry</text>
<text class="ts" x="120" y="245" dominant-baseline="central" fill="#185FA5">Devices declare capabilities on join</text>
<text class="ts" x="520" y="230" dominant-baseline="central" text-anchor="middle" fill="#185FA5">CapabilityManifest · emergency_capable</text>

<!-- Arrow -->
<line x1="340" y1="262" x2="340" y2="282" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>

<!-- Layer 2 — Secure -->
<rect class="layer" x="40" y="282" width="600" height="64" rx="8" fill="#FAEEDA" stroke="#BA7517"/>
<text class="th" x="120" y="309" dominant-baseline="central" fill="#412402">Layer 2 — Secure channel</text>
<text class="ts" x="120" y="329" dominant-baseline="central" fill="#633806">mTLS · local PKI · no internet required</text>
<text class="ts" x="520" y="314" dominant-baseline="central" text-anchor="middle" fill="#633806">SHA-256 audit log · API keys</text>

<!-- Arrow -->
<line x1="340" y1="346" x2="340" y2="366" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>

<!-- Layer 1 — Transport -->
<rect class="layer" x="40" y="366" width="600" height="64" rx="8" fill="#F1EFE8" stroke="#888780"/>
<text class="th" x="120" y="393" dominant-baseline="central" fill="#2C2C2A">Layer 1 — Transport (HAL)</text>
<text class="ts" x="120" y="413" dominant-baseline="central" fill="#5F5E5A">Any physical medium</text>
<text class="ts" x="520" y="398" dominant-baseline="central" text-anchor="middle" fill="#5F5E5A">WiFi · BLE · Zigbee · Z-Wave · Thread</text>

<!-- Arrow to devices -->
<line x1="340" y1="430" x2="340" y2="460" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>

<!-- Device label -->
<text class="ts" x="340" y="455" text-anchor="middle" fill="#888">Physical devices</text>

<!-- Device boxes -->
<rect x="50"  y="468" width="90"  height="34" rx="6" fill="#F1EFE8" stroke="#B4B2A9"/>
<text class="ts" x="95"  y="485" text-anchor="middle" dominant-baseline="central">Lights</text>

<rect x="158" y="468" width="90"  height="34" rx="6" fill="#F1EFE8" stroke="#B4B2A9"/>
<text class="ts" x="203" y="485" text-anchor="middle" dominant-baseline="central">Locks</text>

<rect x="266" y="468" width="90"  height="34" rx="6" fill="#F1EFE8" stroke="#B4B2A9"/>
<text class="ts" x="311" y="485" text-anchor="middle" dominant-baseline="central">Sensors</text>

<rect x="374" y="468" width="90"  height="34" rx="6" fill="#F1EFE8" stroke="#B4B2A9"/>
<text class="ts" x="419" y="485" text-anchor="middle" dominant-baseline="central">Alarms</text>

<rect x="482" y="468" width="148" height="34" rx="6" fill="#F1EFE8" stroke="#B4B2A9"/>
<text class="ts" x="556" y="485" text-anchor="middle" dominant-baseline="central">Notifications</text>

<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
</svg>
