name: Release

# Publishes what a person installs, from this repository and nothing else:
#
#   image   ghcr.io/<repo>  linux/amd64 + linux/arm64 (a Raspberry Pi), also the
#           Home Assistant add-on's image. `edge` from main; `<version>` and
#           `latest` from a v* tag. Smoke-tested before it is pushed.
#   pypi    the wheel and sdist, on a v* tag, by PyPI trusted publishing (no
#           token stored here; the project owner enables the publisher once).
#   github  a GitHub release with that version's CHANGELOG section.

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: Container image (amd64 + arm64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: A tag must match the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V=$(python3 -c "import re;print(re.search(r'__version__ = \"(.+)\"', open('dosync/__init__.py').read()).group(1))")
          test "v$V" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} but package $V"; exit 1; }
          A=$(python3 -c "import yaml;print(yaml.safe_load(open('homeassistant-addon/config.yaml'))['version'])")
          test "$A" = "$V" || { echo "add-on $A but package $V"; exit 1; }

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build for this runner and try it as a person would
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: dosync:smoke
      - name: Smoke test — starts, prints a token, serves the dashboard and WoT discovery
        run: |
          docker run -d --name smoke -p 47290:47200 dosync:smoke
          for i in $(seq 1 40); do curl -sf -o /dev/null http://127.0.0.1:47290/.well-known/wot && break; sleep 1; done
          curl -sf http://127.0.0.1:47290/.well-known/wot | grep -q ThingDirectory
          curl -sf http://127.0.0.1:47290/ | grep -q "openGovernance()"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:47290/v1/devices)
          test "$code" = "401" || { echo "auth must be on by default, got $code"; docker logs smoke; exit 1; }
          docker logs smoke 2>&1 | grep -A3 -i "token" | head -5
          docker exec smoke dosync-mcp --help > /dev/null
          echo '{"auth_required": true, "operator_token": "smoke-operator-token", "configuration_credential": "operator"}' > /tmp/options.json
          docker rm -f smoke
          # As a Home Assistant add-on: options from /data/options.json
          docker run -d --name addon -p 47291:47200 -v /tmp/options.json:/data/options.json:ro dosync:smoke
          for i in $(seq 1 40); do curl -sf -o /dev/null http://127.0.0.1:47291/.well-known/wot && break; sleep 1; done
          docker logs addon 2>&1 | grep -q "Home Assistant add-on" || { docker logs addon; exit 1; }
          docker rm -f addon

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=edge,branch=main
      - name: Build and push amd64 + arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  pypi:
    name: PyPI (trusted publishing)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from the CHANGELOG
        run: |
          V="${GITHUB_REF_NAME#v}"
          awk -v v="$V" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on {print}' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG has no section for $V"; exit 1; }
          gh release create "$GITHUB_REF_NAME" --title "DoSync $V" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
