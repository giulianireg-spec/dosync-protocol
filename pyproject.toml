[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dosync"
dynamic = ["version"]
description = "The semantic layer between AI agents and physical devices"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Rodrigo Giuliani", email = "rgiuliani@dosync.dev" }]
keywords = [
    "iot", "ai-agents", "protocol", "semantic", "orchestration",
    "audit", "governance", "mcp", "home-automation", "robotics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
    "Topic :: System :: Distributed Computing",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

# Core only. Every device adapter brings its own library and each is OPTIONAL —
# adapters import lazily and degrade to simulated mode when the library is
# absent. Installing DoSync does NOT pull in libraries for hardware you do not
# own. Floors are VERIFIED (the suite passes against them), not aspirational;
# see requirements.txt for the full reasoning behind each bound.
dependencies = [
    "fastapi>=0.115.0,<1.0",
    "uvicorn>=0.23.0,<1.0",
    "pydantic>=2.7.0,<3.0",
    "jsonschema>=4.18,<5.0",
    # DISCOVERY libraries belong in the core install, unlike CONTROL libraries.
    #
    # The rule elsewhere in this file — do not pull in libraries for hardware you
    # do not own — is right for control: you install dosync[wiz] because you know
    # you have WiZ bulbs. Discovery is how you find out WHAT you have, so the
    # dependency is needed BEFORE the knowledge that would justify installing it.
    # Left optional, a user scans, sees nothing, and concludes DoSync does not
    # support Bluetooth — a false conclusion caused by our packaging.
    #
    # ~20 MB, and DoSync degrades gracefully without it (the adapter reports the
    # transport as not searchable rather than failing), so a constrained
    # deployment can `pip uninstall bleak` and lose only BLE discovery.
    "bleak>=0.21",
    # Same rule, other transport: mDNS/DNS-SD is how most WiFi devices with a
    # local API announce themselves, and asking someone to install a library
    # before they can find out what they own is the same circle.
    "zeroconf>=0.130",
    # Same reasoning: the shipped device examples are YAML, and examples are how
    # someone writes their first adapter. A user who must first discover that
    # they need a YAML library has been handed the problem instead of the answer.
    "pyyaml>=6.0.1",
    # Declarative adapters speak HTTP, and HTTP is the only transport they
    # speak. Leaving this in an extra meant a user's first declarative device
    # failed at EXECUTION — during an intent, possibly an emergency — rather
    # than at load. Third time this circle appeared in two days; see
    # DESIGN-PRINCIPLES on dependencies of advertised capabilities.
    "aiohttp>=3.9.0",
    # MQTT is the second transport declarative adapters speak, and the most
    # common one in industry after HTTP. 616 KB — thirty times smaller than
    # bleak — so the rule about dependencies of advertised capabilities applies
    # without a size argument to weigh against it.
    "paho-mqtt>=2.0.0",
]

[project.optional-dependencies]
wiz     = ["pywizlight>=0.5.0"]
mqtt    = ["paho-mqtt>=2.0.0"]
ha      = ["aiohttp>=3.9.0"]
# Kept so `dosync[ble]` and `dosync[all]` keep resolving; bleak is now core.
ble     = ["bleak>=0.21"]
sms     = ["twilio>=8.0.0"]
mavlink = ["pymavlink>=2.4.0"]
mcp     = ["mcp>=1.0.0"]
# Everything a fully-loaded deployment needs.
all = [
    "pywizlight>=0.5.0", "paho-mqtt>=2.0.0", "aiohttp>=3.9.0",
    "bleak>=0.21", "twilio>=8.0.0", "pymavlink>=2.4.0", "mcp>=1.0.0",
]
dev = [
    "pytest>=7.4", "pytest-asyncio>=0.23", "httpx>=0.27",
]

[project.urls]
Homepage      = "https://dosync.dev"
Repository    = "https://github.com/giulianireg-spec/dosync-protocol"
Specification = "https://github.com/giulianireg-spec/dosync-protocol/blob/main/spec/DoSync-SPEC-v0.1.md"
Issues        = "https://github.com/giulianireg-spec/dosync-protocol/issues"

[project.scripts]
dosync-hub     = "dosync.cli:hub"
dosync-manage  = "dosync.manage:main"
dosync-certify = "dosync.certify:main"

[tool.setuptools.dynamic]
version = { attr = "dosync.__version__" }

[tool.setuptools.packages.find]
include = ["dosync*"]

[tool.setuptools.package-data]
# dashboard.html is the only thing a non-developer can open. It lived at the
# repository root and was therefore absent from every `pip install dosync`,
# while the handler looked for it next to server.py — so the one entry point
# that does not require curl was missing in the package and broken in a clone.
dosync = ["py.typed", "dashboard.html", "examples/declarative/*"]
