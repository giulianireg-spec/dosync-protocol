services:

  dosync-hub:
    build: .
    container_name: dosync-hub
    ports:
      - "47200:47200"
    volumes:
      - dosync-data:/data
    environment:
      - DOSYNC_AUTH=false
      - DOSYNC_DB_PATH=/data/dosync.db
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:47200/v1/status')"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  dosync-seed:
    build: .
    container_name: dosync-seed
    depends_on:
      dosync-hub:
        condition: service_healthy
    environment:
      - PYTHONPATH=/app
    command: python3 demo_seed.py --hub http://dosync-hub:47200
    volumes:
      - ./demo_seed.py:/app/demo_seed.py
    restart: "no"

volumes:
  dosync-data:
