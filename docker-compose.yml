services:

  dosync-hub:
    build: .
    container_name: dosync-hub
    ports:
      - "47200:47200"
    volumes:
      - dosync-data:/data
    environment:
      - DOSYNC_AUTH=true
      - DOSYNC_DB_PATH=/data/dosync.db
      # Demo token — change before any non-local deployment
      - DOSYNC_DEMO_TOKEN=dosync-demo-token
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request, os; req=urllib.request.Request('http://localhost:47200/v1/status', headers={'Authorization':'Bearer '+os.environ.get('DOSYNC_DEMO_TOKEN','dosync-demo-token')}); urllib.request.urlopen(req)"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  dosync-seed:
    build: .
    container_name: dosync-seed
    depends_on:
      dosync-hub:
        condition: service_healthy
    environment:
      - PYTHONPATH=/app
      - DOSYNC_DEMO_TOKEN=dosync-demo-token
    command: python3 demo_seed.py --hub http://dosync-hub:47200 --token dosync-demo-token
    volumes:
      - ./demo_seed.py:/app/demo_seed.py
    restart: "no"

volumes:
  dosync-data:
